<header>
    <div class="header-container">
        <a href="index.html" class="logo1">
            <img src="assets/images/bioparking_transparente.png" alt="logo-parqueadero" />
        </a>

        <nav>
            <ul class="menu" id="main-menu">
                <li class="dropdown" id="menu-principal">
                    <a href="#">Menú</a>
                    <ul class="submenu" id="menu-items">
                    </ul>
                </li>
                <li id="auth-section">
                    <a href="login.html" id="login-link">Iniciar sesión</a>
                </li>
            </ul>
        </nav>
    </div>

    <style>
        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .user-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--morado);
        }
        .user-role {
            font-size: 11px;
            color: var(--texto-muted);
            text-transform: capitalize;
        }
        .btn-logout {
            background: var(--error);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }
        .btn-logout:hover {
            background: #b91c1c;
        }
    </style>

    <script>
        const menuItemsByRole = {
            usuario: [
                { text: 'Disponibilidad', href: 'index.html', icon: '🅿️' },
                { text: 'Mi Perfil', href: 'perfil.html', icon: '👤' }
            ],
            operador: [
                { text: 'Disponibilidad', href: 'index.html', icon: '🅿️' },
                { text: 'Registrar Acceso', href: 'registro-accesos.html', icon: '🚗' },
                { text: 'Registrar Incidencia', href: 'incidencias.html', icon: '⚠️' },
                { text: 'Mi Perfil', href: 'perfil.html', icon: '👤' }
            ],
            administrador: [
                { text: 'Disponibilidad', href: 'index.html', icon: '🅿️' },
                { text: 'Usuarios', href: 'registro-usuarios.html', icon: '👥' },
                { text: 'Vehículos', href: 'registroVehiculos.html', icon: '🚙' },
                { text: 'Accesos', href: 'registro-accesos.html', icon: '🚗' },
                { text: 'Incidencias', href: 'incidencias.html', icon: '⚠️' },
                { text: 'Informes', href: 'informes.html', icon: '📊' },
                { text: 'Mi Perfil', href: 'perfil.html', icon: '👤' }
            ]
        };

        function updateHeaderAuth() {
            const authSection = document.getElementById('auth-section');
            const menuItems = document.getElementById('menu-items');
            const user = api.getCurrentUser();

            if (user) {
                const rol = user.rol || 'usuario';
                const items = menuItemsByRole[rol] || menuItemsByRole.usuario;
                
                let itemsHtml = items.map(item => 
                    `<li><a href="${item.href}">${item.icon} ${item.text}</a></li>`
                ).join('');
                
                menuItems.innerHTML = itemsHtml;
                
                const nombreMostrar = user.nombre || `${user.primerNombre} ${user.primerApellido}`;
                const rolMostrar = rol.charAt(0).toUpperCase() + rol.slice(1);
                
                authSection.innerHTML = `
                    <div class="user-menu">
                        <div class="user-info">
                            <span class="user-name">${nombreMostrar}</span>
                            <span class="user-role">${rolMostrar}</span>
                        </div>
                        <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
                    </div>
                `;
            } else {
                menuItems.innerHTML = `
                    <li><a href="login.html">🔑 Iniciar sesión</a></li>
                `;
                authSection.innerHTML = '<a href="login.html">Iniciar sesión</a>';
            }
        }

        function logout() {
            api.logout();
            showNotification('Sesión cerrada', 'info');
            window.location.href = 'login.html';
        }

        if (typeof api !== 'undefined') {
            updateHeaderAuth();
        }

        document.addEventListener('DOMContentLoaded', updateHeaderAuth);
    </script>
</header>
