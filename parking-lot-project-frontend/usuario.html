<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BioParking - Usuario</title>
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="icon" type="image/png" href="assets/images/Logo_P.png" />
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
</head>

<body id="login-page">
    <script src="js/load-header.js"></script>
    <div class="login-container">
        <img src="assets/images/bioparking_transparente.png" alt="BioParking Logo" class="login-logo" />
        <h2>Ingreso de Usuario</h2>
        <p style="text-align: center; margin-bottom: 20px; color: var(--texto-muted); font-size: 14px;">
            Solo ingresa tu número de documento
        </p>
        
        <form id="loginForm">
            <div class="input-group">
                <span class="icon">🪪</span>
                <input type="text" id="documento" placeholder="Número de documento" required />
            </div>
            
            <a href="registro-usuarios.html" class="Crear-cuenta">Crear cuenta</a>
            <nav>
                <ul>
                    <a href="login.html" class="Crear-cuenta">Ingresar como operador/admin</a>
                </ul>
            </nav>
            <button type="submit" class="btn-login">Iniciar sesión</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const documento = document.getElementById('documento').value;

            try {
                const user = await api.login(documento, null);
                showNotification(`Bienvenido ${user.nombre}`, 'success');
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            } catch (error) {
                showNotification(error.message, 'error');
            }
        });

        if (api.isAuthenticated()) {
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
