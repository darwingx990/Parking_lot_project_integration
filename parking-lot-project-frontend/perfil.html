<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Perfil | BioParking</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="icon" type="image/png" href="assets/images/Logo_P.png" />
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
</head>

<body id="perfil-page">
    <div class="container">
        <header>
            <div class="accent-bar"></div>
            <h1>Mi Perfil</h1>
            <p>Gestiona tu información personal</p>
        </header>

        <div id="perfil-content" style="display: none;">
            <div class="tab-panel active">
                <div class="card">
                    <h2>Información personal</h2>
                    <form id="form-perfil">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Tipo de documento</label>
                                <input type="text" id="tipoDocumento" readonly />
                            </div>
                            <div class="form-group">
                                <label>Número de documento</label>
                                <input type="text" id="numeroDocumento" readonly />
                            </div>
                            <div class="form-group">
                                <label>Primer nombre</label>
                                <input type="text" id="primerNombre" />
                            </div>
                            <div class="form-group">
                                <label>Segundo nombre</label>
                                <input type="text" id="segundoNombre" />
                            </div>
                            <div class="form-group">
                                <label>Primer apellido</label>
                                <input type="text" id="primerApellido" />
                            </div>
                            <div class="form-group">
                                <label>Segundo apellido</label>
                                <input type="text" id="segundoApellido" />
                            </div>
                            <div class="form-group full">
                                <label>Correo electrónico</label>
                                <input type="email" id="direccionCorreo" />
                            </div>
                            <div class="form-group full">
                                <label>Número de celular</label>
                                <input type="tel" id="numeroCelular" />
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary" style="margin-top: 24px">Guardar cambios</button>
                    </form>
                </div>

                <div class="card" style="margin-top: 24px;" id="card-cambiar-clave">
                    <h2>Cambiar contraseña</h2>
                    <p class="info-note">Solo si eres operador o administrador. Los usuarios normales no tienen contraseña.</p>
                    <form id="form-cambiar-clave">
                        <div class="form-grid">
                            <div class="form-group full">
                                <label>Contraseña actual</label>
                                <input type="password" id="clave-actual" />
                            </div>
                            <div class="form-group full">
                                <label>Nueva contraseña</label>
                                <input type="password" id="clave-nueva" />
                            </div>
                            <div class="form-group full">
                                <label>Confirmar contraseña</label>
                                <input type="password" id="clave-confirmar" />
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary" style="margin-top: 24px">Cambiar contraseña</button>
                    </form>
                </div>
            </div>
        </div>

        <div id="perfil-loading" style="text-align: center; padding: 40px;">
            <p>Cargando perfil...</p>
        </div>

        <div id="perfil-error" style="display: none; text-align: center; padding: 40px; color: var(--error);">
            <p>Error al cargar el perfil</p>
        </div>
    </div>

    <script src="js/load-header.js"></script>
    
    <script>
        async function cargarPerfil() {
            const loading = document.getElementById('perfil-loading');
            const content = document.getElementById('perfil-content');
            const error = document.getElementById('perfil-error');
            const cardClave = document.getElementById('card-cambiar-clave');
            
            const user = api.getCurrentUser();
            
            if (!user) {
                showNotification('Debes iniciar sesión', 'error');
                window.location.href = 'login.html';
                return;
            }

            try {
                const perfil = await api.perfil.get(user.id);
                
                document.getElementById('tipoDocumento').value = perfil.tipoDocumento || '';
                document.getElementById('numeroDocumento').value = perfil.numeroDocumento || '';
                document.getElementById('primerNombre').value = perfil.primerNombre || '';
                document.getElementById('segundoNombre').value = perfil.segundoNombre || '';
                document.getElementById('primerApellido').value = perfil.primerApellido || '';
                document.getElementById('segundoApellido').value = perfil.segundoApellido || '';
                document.getElementById('direccionCorreo').value = perfil.direccionCorreo || '';
                document.getElementById('numeroCelular').value = perfil.numeroCelular || '';
                
                if (user.rol === 'usuario') {
                    cardClave.style.display = 'none';
                }
                
                loading.style.display = 'none';
                content.style.display = 'block';
                
            } catch (error) {
                console.error('Error cargando perfil:', error);
                loading.style.display = 'none';
                error.style.display = 'block';
            }
        }

        document.getElementById('form-perfil').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const user = api.getCurrentUser();
            if (!user) return;

            const data = {
                primerNombre: document.getElementById('primerNombre').value,
                segundoNombre: document.getElementById('segundoNombre').value || null,
                primerApellido: document.getElementById('primerApellido').value,
                segundoApellido: document.getElementById('segundoApellido').value || null,
                direccionCorreo: document.getElementById('direccionCorreo').value,
                numeroCelular: document.getElementById('numeroCelular').value
            };

            try {
                await api.perfil.update(user.id, data);
                showNotification('Perfil actualizado correctamente', 'success');
            } catch (error) {
                showNotification(error.message || 'Error al actualizar perfil', 'error');
            }
        });

        document.getElementById('form-cambiar-clave').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const user = api.getCurrentUser();
            if (!user || user.rol === 'usuario') return;

            const claveActual = document.getElementById('clave-actual').value;
            const claveNueva = document.getElementById('clave-nueva').value;
            const claveConfirmar = document.getElementById('clave-confirmar').value;

            if (claveNueva !== claveConfirmar) {
                showNotification('Las contraseñas no coinciden', 'error');
                return;
            }

            if (claveNueva.length < 4) {
                showNotification('La contraseña debe tener al menos 4 caracteres', 'error');
                return;
            }

            try {
                await api.perfil.cambiarClave(user.id, claveActual, claveNueva);
                showNotification('Contraseña actualizada correctamente', 'success');
                document.getElementById('form-cambiar-clave').reset();
            } catch (error) {
                showNotification(error.message || 'Error al cambiar contraseña', 'error');
            }
        });

        document.addEventListener('DOMContentLoaded', cargarPerfil);
    </script>
</body>

</html>
