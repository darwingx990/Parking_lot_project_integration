<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioParking</title>
  <link rel="stylesheet" href="styles/styles.css" />
  <link rel="icon" type="image/png" href="assets/images/Logo_P.png" />
</head>

<body id="login-page">
  <div class="login-container">
    <img src="assets/images/bioparking_transparente.png" alt="BioParking Logo" class="login-logo" />

    <form action="./index.html">
      <div class="input-group">
        <span class="icon">🪪</span>
        <input type="text" placeholder="Documento" required />
      </div>
      <div class="input-group">
        <span class="icon">🔒</span>
        <input type="password" placeholder="Contraseña" required />
      </div>
      <a href="olvidaste_contraseña.html" class="forgot">¿Olvidaste tu contraseña?</a>
      <a href="registro-usuarios.html" class="Crear-cuenta">Crear cuenta</a>
      <nav>
        <ul>
          <a href="usuario.html" class="Crear-cuenta">Ingresar como usuario</a>
        </ul>
      </nav>
      <button type="submit" class="btn-login">Login</button>
    </form>
  </div>
</body>

</html>
