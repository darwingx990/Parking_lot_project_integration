<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="styles/styles.css"/>
    <link rel="icon" type="image/png" href="assets/images/Logo_P.png" />
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
  </head>
  <body id="login-page">
    <script src="js/load-header.js"></script>
     <div class="login-container">
      <img
        src="assets/images/bioparking_transparente.png"
        alt="BioParking Logo"
        class="login-logo"
      />
      <h2>Recuperar contraseña</h2>
      <form>
        <div class="input-group">
          <span class="icon">📧</span>
          <input type="email" placeholder="Ingrese su correo" required />
        </div>
        <div class="input-group">
          <span class="icon">📞</span>
          <input type="tel" placeholder="Ingrese su telefono" required />
        </div>
        <a href="login.html" class="forgot">Volver al inicio</a>
        <a href="registro-usuarios.html" class="Crear-cuenta">Crear cuenta</a>
        </nav>
        <button type="submit" class="btn-login">Recuperar</button>
      </form>
    </div>
  </body>
</html>
