<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="styles/styles.css"/>
    <link rel="icon" type="image/png" href="assets/images/Logo_P.png" />
    <script src="js/api.js"></script>
  </head>
  <body id="login-page">
     <div class="login-container">
      <img
        src="assets/images/bioparking_transparente.png"
        alt="BioParking Logo"
        class="login-logo"
      />
      <h2>Recuperar contraseña</h2>
      <form id="recoverForm">
        <div class="input-group">
            <span class="icon">🪪</span>
            <input type="text" id="documento" placeholder="Ingrese su documento" required />
          </div>
        <div class="input-group">
          <span class="icon">📧</span>
          <input type="email" id="correo" placeholder="Ingrese su correo" required />
        </div>
        <div class="input-group">
            <span class="icon">🔒</span>
            <input type="password" id="nuevaClave" placeholder="Nueva contraseña" required />
          </div>
        <a href="login.html" class="forgot">Volver al inicio</a>
        <a href="registro-usuarios.html" class="Crear-cuenta">Crear cuenta</a>
        <button type="submit" class="btn-login">Restablecer contraseña</button>
      </form>
    </div>

    <script>
        document.getElementById('recoverForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const documento = document.getElementById('documento').value;
            const correo = document.getElementById('correo').value;
            const nuevaClave = document.getElementById('nuevaClave').value;

            try {
                const response = await api.usuarios.recoverPassword({ documento, correo, nuevaClave });
                showNotification(response.message, 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (error) {
                showNotification(error.message, 'error');
            }
        });
    </script>
  </body>
</html>
