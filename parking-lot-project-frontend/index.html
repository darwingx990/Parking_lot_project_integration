<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BioParking</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="icon" href="assets/images/logo.jpg">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <img src="assets/images/bioparking_transparente.png" alt="BioParking Logo" class="logo">
                <h1>Bienvenido</h1>
                <p>Ingresa tus credenciales para continuar</p>
            </div>
            <div class="login-tabs">
                <button type="button" class="tab-btn active" data-role="personal">Personal</button>
                <button type="button" class="tab-btn" data-role="usuario">Soy Usuario</button>
            </div>
            <form id="loginForm">
                <input type="hidden" id="loginRole" value="personal">
                <div class="input-group">
                    <label for="numeroDocumento" id="idLabel">Número de Documento</label>
                    <input type="text" id="numeroDocumento" name="numeroDocumento" required placeholder="Ej: 100100100">
                </div>
                <div class="input-group" id="passwordGroup">
                    <label for="clave">Contraseña</label>
                    <input type="password" id="clave" name="clave" required placeholder="Ej: admin123">
                </div>
                <button type="submit" class="btn-login">Iniciar Sesión</button>
                <div id="loginMessage" class="message"></div>
            </form>
        </div>
    </div>
    <script type="module" src="js/views/Login.js"></script>
</body>
</html>
