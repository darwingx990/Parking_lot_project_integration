<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BioParking - Disponibilidad</title>
    <link rel="icon" type="image/png" href="assets/images/Logo_P.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/api.js"></script>
</head>

<body id="espacios-page">
    <main class="main">
        <h1>VisualizaciÃ³n de Celdas de Parqueo</h1>
        <p class="subtitle">Estado general por Ã¡reas y niveles</p>
        
        <!-- Resumen de disponibilidad -->
        <div id="resumen-container" style="display:none; display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;">
            <div style="background: white; border: 1px solid var(--borde); border-radius: 10px; padding: 16px 24px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow);">
                <div style="width:12px; height:12px; border-radius:50%; background: var(--exito); flex-shrink:0;"></div>
                <div>
                    <div id="count-libres" style="font-size: 1.5rem; font-weight: 700; color: var(--exito); line-height:1;">â€”</div>
                    <div style="font-size:0.78rem; color: var(--texto-muted); margin-top:2px;">Celdas libres</div>
                </div>
            </div>
            <div style="background: white; border: 1px solid var(--borde); border-radius: 10px; padding: 16px 24px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow);">
                <div style="width:12px; height:12px; border-radius:50%; background: var(--error); flex-shrink:0;"></div>
                <div>
                    <div id="count-ocupadas" style="font-size: 1.5rem; font-weight: 700; color: var(--error); line-height:1;">â€”</div>
                    <div style="font-size:0.78rem; color: var(--texto-muted); margin-top:2px;">Celdas ocupadas</div>
                </div>
            </div>
            <div style="background: white; border: 1px solid var(--borde); border-radius: 10px; padding: 16px 24px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow);">
                <div style="width:12px; height:12px; border-radius:50%; background: var(--morado); flex-shrink:0;"></div>
                <div>
                    <div id="count-porcentaje" style="font-size: 1.5rem; font-weight: 700; color: var(--morado); line-height:1;">â€”%</div>
                    <div style="font-size:0.78rem; color: var(--texto-muted); margin-top:2px;">OcupaciÃ³n</div>
                </div>
            </div>
        </div>

        <div id="loading-indicator" style="text-align: center; padding: 40px;">
            <div class="spinner"></div>
            <p style="color: var(--texto-muted); font-size: 0.9rem; margin-top: 8px;">Cargando estado de celdas...</p>
        </div>

        <section class="parking-container" id="parking-container" style="display: none;">
        </section>

        <div style="text-align: center; margin-top: 30px;">
            <button onclick="loadParkingStatus()" style="background: var(--morado); color: white; border: none; padding: 12px 28px; border-radius: 8px; cursor: pointer; font-size: 14px; font-family: inherit; font-weight: 500; transition: background 0.2s, transform 0.15s; display: inline-flex; align-items: center; gap: 8px;">
                ðŸ”„ Actualizar
            </button>
        </div>
    </main>

    <script src="js/load-header.js"></script>
    
    <script>
        async function loadParkingStatus() {
            const container = document.getElementById('parking-container');
            const loading = document.getElementById('loading-indicator');
            
            loading.style.display = 'block';
            container.style.display = 'none';

            try {
                const celdas = await api.getEstado.getAll();
                const areas = {
                    'A': { nombre: 'Ãrea A â€” Nivel 1', celdas: [] },
                    'B': { nombre: 'Ãrea B â€” Nivel 1', celdas: [] },
                    'C': { nombre: 'Ãrea C â€” Nivel 2', celdas: [] },
                    'D': { nombre: 'Ãrea D â€” Nivel 2', celdas: [] }
                };

                let totalLibres = 0;
                let totalOcupadas = 0;

                celdas.forEach((celda, index) => {
                    const letras = ['A', 'B', 'C', 'D'];
                    const letra = letras[index % 4];
                    const numero = String(index + 1).padStart(2, '0');
                    const estado = celda.estado === 'Libre' ? 'disponible' : 'ocupada';
                    
                    if (estado === 'disponible') totalLibres++;
                    else totalOcupadas++;
                    
                    if (areas[letra]) {
                        areas[letra].celdas.push({
                            id: celda.id,
                            numero: `${letra}-${numero}`,
                            tipo: celda.tipo.toLowerCase(),
                            estado
                        });
                    }
                });

                // Actualizar contadores de resumen
                const total = totalLibres + totalOcupadas;
                document.getElementById('count-libres').textContent = totalLibres;
                document.getElementById('count-ocupadas').textContent = totalOcupadas;
                document.getElementById('count-porcentaje').textContent = total > 0
                    ? Math.round((totalOcupadas / total) * 100) + '%'
                    : '0%';
                document.getElementById('resumen-container').style.display = 'flex';

                container.innerHTML = '';

                Object.keys(areas).forEach(key => {
                    const area = areas[key];
                    if (area.celdas.length === 0) return;
                    const areaDiv = document.createElement('div');
                    areaDiv.className = 'area';
                    
                    let cellsHtml = '';
                    area.celdas.forEach(celda => {
                        const icono = celda.estado === 'disponible' ? '' : (celda.tipo === 'carro' ? 'ðŸš—' : 'ðŸï¸');
                        cellsHtml += `
                            <div class="cell ${celda.estado} ${celda.tipo}" 
                                 title="Celda ${celda.numero} â€” ${celda.tipo} â€” ${celda.estado === 'disponible' ? 'Libre' : 'Ocupada'}">
                                ${icono ? `<div class="cell-icon">${icono}</div>` : ''}
                                <span>${celda.numero}</span>
                            </div>`;
                    });

                    areaDiv.innerHTML = `
                        <h2>${area.nombre}</h2>
                        <div class="cells">${cellsHtml}</div>
                    `;
                    container.appendChild(areaDiv);
                });

                loading.style.display = 'none';
                container.style.display = 'grid';

            } catch (error) {
                console.error('Error cargando celdas:', error);
                loading.innerHTML = '<div class="empty-state"><div class="empty-icon">âš ï¸</div><div class="empty-title">Error al cargar</div><div class="empty-sub">Verifique la conexiÃ³n con el servidor</div></div>';
                loading.style.display = 'block';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadParkingStatus();
            setInterval(loadParkingStatus, 30000);
        });
    </script>
</body>

</html>
